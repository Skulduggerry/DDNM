ddnm:
    repeat_cnt: 4
    kernel_size: 15
    target_distance_mm: 585.0
    low_resolution_pixel_pitch_mm: 0.00345
    focal_length_mm: 2.0
    output_size: 256

    cg_rtol: 1e-5
    cg_rho: 5e-2
    cg_max_iter: 30

data:
    dataset: "ImageNet"
    image_size: 256
    channels: 3
    logit_transform: false
    uniform_dequantization: false
    gaussian_dequantization: false
    random_flip: true
    rescaled: true
    num_workers: 0
    subset_1k: False #True
    out_of_dist: True #False

model:
    type: "openai"
    in_channels: 3
    out_channels: 3
    num_channels: 256
    num_heads: 4
    num_res_blocks: 2
    attention_resolutions: "32,16,8"
    dropout: 0.0
    resamp_with_conv: True
    learn_sigma: True
    use_scale_shift_norm: true
    use_fp16: true
    resblock_updown: true
    num_heads_upsample: -1
    var_type: 'fixedsmall'
    num_head_channels: 64
    image_size: 256
    class_cond: false
    use_new_attention_order: false

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

sampling:
    batch_size: 1

time_travel:
    T_sampling: 250
    travel_length: 1
    travel_repeat: 2